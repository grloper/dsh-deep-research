# Run locally: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v10.12.0
    hooks:
      - id: eslint
        files: '^(lib|bin|bench|demo|test)/'
        types: [file]
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
